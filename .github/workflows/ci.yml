name: ci
# Checks for pull requests (pushes to main are checked by the pages workflow).
on: [pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go run ./cmd/fpn check
      - run: go run ./cmd/fpn build
