<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 11 11" width="44" height="44" shape-rendering="crispEdges" role="img" aria-label="Blue the hen, in pixel art"><style> .a{animation:on 0.5s steps(1) infinite} .b{animation:off 0.5s steps(1) infinite}@keyframes on{0%{opacity:1}50%{opacity:0}}@keyframes off{0%{opacity:0}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.a{opacity:0}}.peck{transform-origin:3px 9px;animation:peck 2.6s steps(1) infinite}@keyframes peck{0%,70%{transform:none}75%,85%{transform:rotate(-28deg) translateY(1px)}}</style><g class="peck"><rect x="2" y="0" width="2" height="1" fill="#d63a2e"/><rect x="1" y="1" width="1" height="1" fill="#d63a2e"/><rect x="2" y="1" width="3" height="1" fill="#4d535c"/><rect x="0" y="2" width="1" height="1" fill="#e9b53c"/><rect x="1" y="2" width="1" height="1" fill="#4d535c"/><rect x="2" y="2" width="1" height="1" fill="#111"/><rect x="3" y="2" width="2" height="1" fill="#4d535c"/><rect x="1" y="3" width="1" height="1" fill="#d63a2e"/><rect x="2" y="3" width="3" height="1" fill="#4d535c"/><rect x="2" y="4" width="3" height="1" fill="#4d535c"/><rect x="9" y="4" width="2" height="1" fill="#4d535c"/><rect x="2" y="5" width="8" height="1" fill="#4d535c"/><rect x="2" y="6" width="2" height="1" fill="#4d535c"/><rect x="4" y="6" width="3" height="1" fill="#8d949e"/><rect x="7" y="6" width="3" height="1" fill="#4d535c"/><rect x="3" y="7" width="1" height="1" fill="#4d535c"/><rect x="4" y="7" width="3" height="1" fill="#8d949e"/><rect x="7" y="7" width="2" height="1" fill="#4d535c"/><rect x="4" y="8" width="4" height="1" fill="#4d535c"/></g><g class="a"><rect x="4" y="9" width="1" height="1" fill="#d9a13a"/><rect x="7" y="9" width="1" height="1" fill="#d9a13a"/><rect x="3" y="10" width="1" height="1" fill="#d9a13a"/><rect x="8" y="10" width="1" height="1" fill="#d9a13a"/></g><g class="b"><rect x="5" y="9" width="2" height="1" fill="#d9a13a"/><rect x="5" y="10" width="2" height="1" fill="#d9a